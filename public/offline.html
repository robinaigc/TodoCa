<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#9e3434" />
    <title>TodoCa · 当前没有网络</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: calc(2rem + env(safe-area-inset-top)) calc(1.25rem + env(safe-area-inset-right)) calc(2rem + env(safe-area-inset-bottom)) calc(1.25rem + env(safe-area-inset-left));
        background: #eef1f6;
        color: #1a1d26;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      }
      main {
        width: min(100%, 28rem);
        padding: 2rem 1.5rem;
        border-radius: 1.75rem;
        background: #fff;
        box-shadow: 0 4px 24px rgb(26 29 38 / 0.08);
        text-align: center;
      }
      h1 { margin: 0; font-size: 1.5rem; }
      p { margin: 0.75rem 0 0; color: #6b7280; line-height: 1.65; }
      button {
        width: 100%;
        min-height: 3rem;
        margin-top: 1.5rem;
        border: 0;
        border-radius: 1rem;
        background: #9e3434;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>当前没有网络</h1>
      <p>TodoCa 暂时无法加载新页面。你已经保存的用户画像和任务进度仍保留在此设备中。</p>
      <button type="button" onclick="window.location.reload()">重新加载</button>
    </main>
  </body>
</html>
